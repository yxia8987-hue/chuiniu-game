<body>
<div id="app">

  <!-- 开始界面 -->
  <div id="startScreen">
    <div class="dice-row" id="titleDice"></div>
    <div>
      <h1>大话骰</h1>
      <div class="sub">吹 牛 · 2-5 人 对 战</div>
    </div>
    <div class="rules">
      <div>🎲 每人 <b>5 颗骰子</b>，<b>1 点是万能牌</b>，可当任何点数。</div>
      <div>📣 轮流叫点：<b>个数更多</b>，或个数相同<b>点数更大</b>。</div>
      <div>🔒 <b>叫斋</b>：1 点不再万能，可以跟上家叫得<b>一样大</b>。</div>
      <div>👀 觉得上家吹牛就点「<b>开</b>」：够数开的人输一颗，不够数叫的人输一颗。</div>
      <div>👥 <b>多人轮流</b>：共用一部手机，轮到谁就递给谁，点「看我的骰子」看牌。</div>
      <div>🏆 输光骰子出局，<b>最后剩下的赢</b>。</div>
    </div>
    <div class="setup">
      <div class="setup-row">
        <span class="setup-label">人数</span>
        <div class="seg" id="countSeg">
          <button data-n="2">2人</button>
          <button data-n="3" class="on">3人</button>
          <button data-n="4">4人</button>
          <button data-n="5">5人</button>
        </div>
      </div>
      <div class="setup-row">
        <span class="setup-label">模式</span>
        <div class="seg" id="modeSeg">
          <button data-m="solo" class="on">单机对 AI</button>
          <button data-m="pass">多人轮流</button>
        </div>
      </div>
      <div class="setup-note" id="modeNote">你 + AI 对手，轮到你时直接操作。</div>
    </div>
    <button class="btn btn-gold" id="startBtn">开始游戏</button>
  </div>

  <!-- 牌桌 -->
  <div id="gameScreen" class="hidden">
    <div class="topbar">
      <span id="roundLabel">第 1 局</span>
      <span>场上骰子 <b id="totalLabel">15</b></span>
    </div>

    <div id="opponents"></div>

    <div id="bidBoard">
      <div id="bidText">还没有人叫点</div>
      <div id="turnText"></div>
    </div>

    <div id="log"></div>

    <div id="myArea">
      <div class="label"><span id="myName">你</span><span class="right"><button class="btn btn-ghost btn-small hidden" id="peekBtn">看我的骰子</button><span class="cnt" id="myCnt"></span></span></div>
      <div id="myDice"></div>
    </div>

    <div id="controls">
      <div class="ctl-row">
        <span class="ctl-label">个数</span>
        <button class="step-btn" id="countMinus">−</button>
        <span id="countVal">2</span>
        <button class="step-btn" id="countPlus">+</button>
        <button class="btn btn-ghost" id="zhaiBtn">叫斋</button>
      </div>
      <div class="ctl-row" id="faceRow">
        <span class="ctl-label">点数</span>
      </div>
      <div id="bidHint"></div>
      <div class="ctl-row">
        <button class="btn btn-call" id="callBtn">叫</button>
        <button class="btn btn-open" id="openBtn">开</button>
      </div>
    </div>

    <div id="revealPanel" class="hidden">
      <div id="revealText"></div>
      <button class="btn btn-gold" id="nextBtn">下一局</button>
    </div>
  </div>

  <!-- 结算 -->
  <div id="overScreen" class="hidden">
    <div id="overTitle"></div>
    <div id="overText"></div>
    <button class="btn btn-gold" id="againBtn">再来一局</button>
    <button class="btn btn-ghost" id="setupBtn" style="width:100%;max-width:300px">换个玩法</button>
  </div>

</div>
